
<div>
  <h3>Register User</h3>
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Wallet:</label>
      <input type="text" [value]="wallet" disabled>
    </div>
    <div>
      <label>Username:</label>
      <input type="text" placeholder="Username" [(ngModel)]="registerData.username" name="username" required>
    </div>
    <div>
      <label>First Name:</label>
      <input type="text" placeholder="First Name" [(ngModel)]="registerData.firstName" name="firstName">
    </div>
    <div>
      <label>Last Name:</label>
      <input type="text" placeholder="Last Name" [(ngModel)]="registerData.lastName" name="lastName">
    </div>
    <div>
      <label>Email:</label>
      <input type="email" placeholder="Email" [(ngModel)]="registerData.email" name="email" required>
    </div>
    <div>
      <label>Description:</label>
      <textarea placeholder="Description" [(ngModel)]="registerData.description" name="description"></textarea>
    </div>
    <button type="submit">Register</button>
    <button type="button" (click)="onCancel()">Cancel</button>
  </form>
</div>
